name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pyright packages/qcraft-engine/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - run: uv run pytest packages/qcraft-engine/tests/ -v

  parity-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - id: check-file
        run: test -f packages/qcraft-engine/tests/test_parity.py && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.check-file.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v4
      - if: steps.check-file.outputs.exists == 'true'
        run: uv sync --all-packages
      - if: steps.check-file.outputs.exists == 'true'
        run: uv run pytest packages/qcraft-engine/tests/test_parity.py -v --tb=long
