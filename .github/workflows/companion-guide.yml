name: Site
run-name: "Tool release: ${{ inputs.operation || 'verify' }} | ${{ inputs.dispatch_receipt_sha256 || github.event.pull_request.number }}"

# The repository's existing single Pages publisher. PRs build and verify only.
# A later explicit approval must expressly cover these fixed forward bytes and
# conditional exact 412-file prior-site restoration, which may share one approval.
# Receipt hashes identify the parent's reviewed records; supplying a hash is
# not itself user consent.
# The guide/static tree is supplied as reviewed bytes, never rerendered in CI.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Reviewed operation under the recorded explicit approval'
        type: choice
        options: [publish, restore-prior-site]
        default: publish
        required: true
      approval_receipt_sha256:
        description: 'Hash of the exact publication and applicable restore approval record'
        required: true
      dispatch_receipt_sha256:
        description: 'Unique dispatch receipt hash; reconcile any uncertain dispatch before retry'
        required: true
      failed_forward_run_id:
        description: 'Restore only: exact completed forward Site run that failed acceptance'
        required: false
      failed_forward_created_at:
        description: 'Restore only: exact created_at from the recorded forward run'
        required: false
      forward_dispatch_receipt_sha256:
        description: 'Restore only: original forward dispatch receipt hash'
        required: false
      rollout_assessment_sha256:
        description: 'Restore only: reviewed evidence that this exact rollout failed acceptance'
        required: false
  pull_request:
    paths:
      - '.github/workflows/companion-guide.yml'
      - '.github/scripts/tool_site_*.py'
      - '.github/scripts/test_tool_site_*.py'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Fixed proposal identities. No arbitrary app ref, archive or digest input.
  PROPOSAL_BASE_MAIN: 67d26b6b77d84ab5f9ad25c06f25232ba1a87b0b
  APP_REF: a6313ad7f8f38e174bd38c89e3419ee1be79cda9
  RELEASE_TAG: qcraft-tool-2026-09-05
  INPUTS_ARCHIVE: qcraft-tool-inputs-2026-09-05.tar.gz
  INPUTS_SHA256: 9054a3257ca143f8d5e7e6180b39e4b1de46d04bc2598f13637554acf49341ac
  STATIC_ARCHIVE: qcraft-tool-static-2026-09-05-final.tar.gz
  STATIC_SHA256: 57aadf3a85cb0c4e4b943d6836a806b596c11e703e8cd15952c1a36a12d3588d
  STATIC_ROOT: static
  SITE_SHA256: b9ca6143527f22a3ac409a446faca35f919c6cbd09d08345de883ab74dc8f05d
  SITE_FILES: '773'
  RESTORE_ARCHIVE: restore-site.tar.gz
  RESTORE_SHA256: 38c81a1f19610c72177dd071d3e40c0452982a1493429b7f56a5f83790c418f4
  RESTORE_SITE_SHA256: 5d8ceaf417a8cb1886b61eb8586403ea619fb60464f4f9bfb8d0c78216bf659c
  RESTORE_SITE_FILES: '412'
  # Match the reviewed portable dist, exercised at /QCraft-App/explorer/.
  # Relative base also retains the same bytes for the managed local fallback.
  VITE_BASE_PATH: ./
  OPERATION: ${{ inputs.operation || 'publish' }}
  APPROVAL_RECEIPT_SHA256: ${{ inputs.approval_receipt_sha256 }}
  DISPATCH_RECEIPT_SHA256: ${{ inputs.dispatch_receipt_sha256 }}
  FAILED_FORWARD_RUN_ID: ${{ inputs.failed_forward_run_id }}
  FAILED_FORWARD_CREATED_AT: ${{ inputs.failed_forward_created_at }}
  FORWARD_DISPATCH_RECEIPT_SHA256: ${{ inputs.forward_dispatch_receipt_sha256 }}
  ROLLOUT_ASSESSMENT_SHA256: ${{ inputs.rollout_assessment_sha256 }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out this exact workflow and its verification helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control

      - name: Test the exact dispatch and payload guards
        run: python -m unittest discover -s release-control/.github/scripts -p 'test_tool_site_*.py' -v

      - name: All reviewed identity pins must be complete
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          for key in ('INPUTS_SHA256', 'STATIC_SHA256', 'SITE_SHA256', 'RESTORE_SHA256', 'RESTORE_SITE_SHA256'):
              assert re.fullmatch('[a-f0-9]{64}', os.environ[key]), f'Unresolved identity: {key}'
          for key in ('RELEASE_TAG', 'STATIC_ARCHIVE', 'STATIC_ROOT'):
              assert '__' not in os.environ[key] and os.environ[key], f'Unresolved identity: {key}'
          assert re.fullmatch('[a-f0-9]{40}', os.environ['APP_REF']), 'Unresolved app source pin'
          assert int(os.environ['SITE_FILES']) > 412
          PY

      - name: Check the current dispatch state before preparing a publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-control/.github/scripts/tool_site_guard.py

      - name: Verify the exact whole-site recovery payload on every build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tool-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RESTORE_ARCHIVE" --dir "$RUNNER_TEMP/tool-assets"
          python release-control/.github/scripts/tool_site_payload.py unpack \
            "$RUNNER_TEMP/tool-assets/$RESTORE_ARCHIVE" "$RESTORE_SHA256" _prior_site
          python release-control/.github/scripts/tool_site_payload.py verify-tree \
            _prior_site "$RESTORE_SITE_SHA256" "$RESTORE_SITE_FILES"

      - name: Check out the exact reviewed Explorer source
        if: env.OPERATION == 'publish'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REF }}
          path: app

      - name: Verify the exact source and archives
        if: env.OPERATION == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_REF"
          for archive in "$INPUTS_ARCHIVE" "$STATIC_ARCHIVE"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$archive" --dir "$RUNNER_TEMP/tool-assets"
          done
          python release-control/.github/scripts/tool_site_payload.py unpack \
            "$RUNNER_TEMP/tool-assets/$INPUTS_ARCHIVE" "$INPUTS_SHA256" "$RUNNER_TEMP/tool-inputs"
          python release-control/.github/scripts/tool_site_payload.py unpack \
            "$RUNNER_TEMP/tool-assets/$STATIC_ARCHIVE" "$STATIC_SHA256" "$RUNNER_TEMP/tool-static"
          (cd "$RUNNER_TEMP/tool-inputs" && sha256sum -c SHA256SUMS --quiet)
          (cd "$RUNNER_TEMP/tool-static" && sha256sum -c SHA256SUMS --quiet)

      - name: Install the pinned Node runtime
        if: env.OPERATION == 'publish'
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'

      - name: Install the Explorer's locked dependencies
        if: env.OPERATION == 'publish'
        run: npm ci --prefix app/apps/qcraft-web

      - name: Stage all three exact input revisions
        if: env.OPERATION == 'publish'
        run: |
          set -euo pipefail
          for revision in weo-2024-10 weo-2026-04 weo-2026-04-full-horizon-v1; do
            test "$(find "$RUNNER_TEMP/tool-inputs/payloads/$revision" -type f -name '*.json' | wc -l)" -eq 175
            cmp "$RUNNER_TEMP/tool-inputs/indexes/$revision/index.json" "app/data/vintages/$revision/json/index.json"
            cmp "$RUNNER_TEMP/tool-inputs/manifests/$revision.json" "app/data/vintages/$revision/manifest.json"
            cp "$RUNNER_TEMP/tool-inputs/payloads/$revision/"*.json "app/data/vintages/$revision/json/"
          done

      - name: Build the exact Explorer for its Pages sub-path
        if: env.OPERATION == 'publish'
        run: npm --prefix app/apps/qcraft-web run build

      - name: Assemble one complete site tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          if [ "$OPERATION" = publish ]; then
            cp -R "$RUNNER_TEMP/tool-static/$STATIC_ROOT/." _site/
            test ! -e _site/explorer
            mkdir _site/explorer
            cp -R app/apps/qcraft-web/dist/. _site/explorer/
            # The app stages only selectable modes; preserve every old Current URL too.
            mkdir -p _site/explorer/data/weo-2026-04
            cp "$RUNNER_TEMP/tool-inputs/payloads/weo-2026-04/"*.json _site/explorer/data/weo-2026-04/
            test -f _site/index.html
            test -f _site/guide/index.html
            test -f _site/docs/index.html
            test -f _site/Q-CRAFT-Explorer-Companion-Guide.pdf
            for revision in weo-2024-10 weo-2026-04 weo-2026-04-full-horizon-v1; do
              test "$(find "_site/explorer/data/$revision" -type f -name '*.json' | wc -l)" -eq 175
            done
            python release-control/.github/scripts/tool_site_payload.py verify-tree _site "$SITE_SHA256" "$SITE_FILES"
          else
            cp -R _prior_site/. _site/
            python release-control/.github/scripts/tool_site_payload.py verify-tree _site "$RESTORE_SITE_SHA256" "$RESTORE_SITE_FILES"
          fi

      - name: Refresh main and the full dispatch inventory immediately before upload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-control/.github/scripts/tool_site_guard.py

      - name: Upload the whole site as one Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the same workflow verification helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - name: Refresh exact main and dispatch guards immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-control/.github/scripts/tool_site_guard.py
      - name: Deploy to the existing GitHub Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
