[project]
name = "qcraft-explorer"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1", "pytest>=8.0"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# The try page (apps/qcraft-sliders) is an npm package, not a Python member;
# without this exclude the apps/* glob demands a pyproject.toml and breaks uv sync.
exclude = ["apps/qcraft-sliders"]

[tool.uv.sources]
qcraft-engine = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
