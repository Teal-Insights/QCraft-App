[project]
name = "qcraft-explorer"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1", "pytest>=8.0"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# qcraft-engine-ts is a TypeScript package; it has no pyproject.toml and would
# otherwise break the packages/* glob.
exclude = ["packages/qcraft-engine-ts"]

[tool.uv.sources]
qcraft-engine = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
