[project]
name = "qcraft-explorer"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1", "pytest>=8.0"]

[tool.uv.workspace]
# Union of the lane workspace edits. `pipeline` (Lane 3) is a real Python
# member; the two excludes are non-Python packages that the globs would
# otherwise force a pyproject.toml onto and break every `uv run` in the repo:
# qcraft-engine-ts (Lane 1) is TypeScript, qcraft-web (Lane 2) is npm.
members = ["packages/*", "apps/*", "pipeline"]
exclude = ["packages/qcraft-engine-ts", "apps/qcraft-web"]

[tool.uv.sources]
qcraft-engine = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
