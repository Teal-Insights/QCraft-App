[project]
name = "qcraft-explorer"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1", "pytest>=8.0"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/qcraft-web is the React/D3 front end (npm, not Python). The apps/*
# glob would otherwise make uv demand a pyproject.toml from it and fail every
# `uv run` in the repo.
exclude = ["apps/qcraft-web"]

[tool.uv.sources]
qcraft-engine = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
