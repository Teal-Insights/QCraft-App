[project]
name = "qcraft-pipeline"
version = "0.1.0"
description = "Refresh Q-CRAFT Explorer input data to a new WEO/WPP vintage."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "qcraft-engine",
]

[project.scripts]
qcraft-pipeline = "qcraft_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcraft_pipeline"]
