<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" role="img" aria-labelledby="title desc"><title id="title">Data reaches the browser through five stages</title><desc id="desc">Public source series pass through the pipeline into vintage country payloads. The browser adapter prepares the country. The TypeScript engine calculates tables, and the export includes settings and provenance.</desc><style>text{font-family:Inter,sans-serif;fill:#143E5A}.box{fill:#E6F4F8;stroke:#0094BC;stroke-width:1.5}.lead{font-size:18px;font-weight:600}.body{font-size:14px}</style><rect width="360" height="580" fill="#FAFAF7"/><rect class="box" x="10" y="10" width="340" height="94" rx="6"/><text x="25" y="38" class="lead">1. Public source series</text><text x="25" y="62" class="body">WEO, UN population, workbook</text><text x="25" y="82" class="body">productivity and climate series</text><path d="M180 105v17" stroke="#0094BC" stroke-width="3"/><rect class="box" x="10" y="124" width="340" height="94" rx="6"/><text x="25" y="152" class="lead">2. Pipeline and payloads</text><text x="25" y="176" class="body">Validate country data and provenance.</text><text x="25" y="196" class="body">Emit the two vintage payload sets.</text><path d="M180 219v17" stroke="#0094BC" stroke-width="3"/><rect class="box" x="10" y="238" width="340" height="94" rx="6"/><text x="25" y="266" class="lead">3. Browser adapter</text><text x="25" y="290" class="body">Load the country and selected mode.</text><text x="25" y="310" class="body">Check coverage and prepare inputs.</text><path d="M180 333v17" stroke="#0094BC" stroke-width="3"/><rect class="box" x="10" y="352" width="340" height="94" rx="6"/><text x="25" y="380" class="lead">4. TypeScript engine</text><text x="25" y="404" class="body">Calculate the baseline, intermediate</text><text x="25" y="424" class="body">tables and six climate scenarios.</text><path d="M180 447v17" stroke="#0094BC" stroke-width="3"/><rect class="box" x="10" y="466" width="340" height="94" rx="6"/><text x="25" y="494" class="lead">5. Charts and exports</text><text x="25" y="518" class="body">Carry the mode, settings, rationale</text><text x="25" y="538" class="body">and source record with the results.</text></svg>