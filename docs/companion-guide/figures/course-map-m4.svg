<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 392" role="img" aria-label="The course map, with the debt paths highlighted." preserveAspectRatio="xMidYMid meet"><title>The course map, with the debt paths highlighted.</title><defs><marker id="qcm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcm-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="8" y="75" width="168" height="52" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="92.0" y="97" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Macro series</text><text class="qcm-sans" x="92.0" y="114" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">IMF World Economic Outlook</text><path d="M 176 101.0 H 192" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><rect x="8" y="139" width="168" height="52" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="92.0" y="161" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Population</text><text class="qcm-sans" x="92.0" y="178" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">UN World Population Prospects</text><path d="M 176 165.0 H 192" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><rect x="8" y="203" width="168" height="52" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="92.0" y="225" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">The controls you set</text><text class="qcm-sans" x="92.0" y="242" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">five of them, in the sidebar</text><path d="M 176 229.0 H 192" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><path d="M 192 101.0 V 229.0" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><line x1="192" y1="165" x2="224" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="212.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">build</text><rect x="232" y="14" width="222" height="292" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="343.0" y="34" font-size="12.5" font-weight="600" fill="#63757F" text-anchor="middle">The three numbers</text><text class="qcm-sans" x="343.0" y="50" font-size="12.5" font-weight="600" fill="#63757F" text-anchor="middle">the equation needs</text><rect x="250" y="60" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="343.0" y="83" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Growth<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">g</tspan></text><text class="qcm-sans" x="343.0" y="99" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">demography, productivity,</text><text class="qcm-sans" x="343.0" y="112" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">inflation</text><rect x="250" y="136" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="343.0" y="159" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Interest rate<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">r</tspan></text><text class="qcm-sans" x="343.0" y="175" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">the rate rule applied</text><text class="qcm-sans" x="343.0" y="188" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">to the debt stock</text><rect x="250" y="212" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="343.0" y="235" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Primary balance<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">pb</tspan></text><text class="qcm-sans" x="343.0" y="251" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">revenue, spending,</text><text class="qcm-sans" x="343.0" y="264" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">the fiscal rule</text><rect x="494" y="104" width="246" height="122" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="617.0" y="130" font-size="14.5" font-weight="600" fill="#2C3E50" text-anchor="middle">The debt dynamics equation</text><text class="qcm-serif" x="617.0" y="170" font-size="14.5" fill="#2C3E50" text-anchor="middle" font-style="italic">d<tspan font-size="9.0" dy="4.1">t</tspan><tspan dy="-4.1"> = d</tspan><tspan font-size="9.0" dy="4.1">t−1</tspan><tspan dy="-4.1" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="9.0" dy="4.1">t</tspan></text><text class="qcm-sans" x="617.0" y="196" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">last year's ratio, grown by r,</text><text class="qcm-sans" x="617.0" y="209" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">shrunk by g</text><rect x="786" y="102" width="126" height="126" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="849.0" y="128" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt paths</text><text class="qcm-sans" x="849.0" y="145" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">baseline and six</text><text class="qcm-sans" x="849.0" y="158" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">warming scenarios</text><line x1="797" y1="219" x2="901" y2="219" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/><polyline points="802.0,214.0 806.7,214.0 811.4,213.9 816.1,213.7 820.8,213.6 825.5,213.4 830.2,213.1 834.9,212.9 839.6,212.6 844.3,212.3 849.0,211.9 853.7,211.6 858.4,211.2 863.1,210.8 867.8,210.3 872.5,209.9 877.2,209.4 881.9,208.9 886.6,208.4 891.3,207.8 896.0,207.3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="802.0,214.0 806.7,213.9 811.4,213.6 816.1,213.2 820.8,212.7 825.5,212.2 830.2,211.5 834.9,210.8 839.6,209.9 844.3,209.0 849.0,208.1 853.7,207.0 858.4,205.9 863.1,204.7 867.8,203.5 872.5,202.2 877.2,200.8 881.9,199.3 886.6,197.8 891.3,196.3 896.0,194.7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round"/><polyline points="802.0,214.0 806.7,213.8 811.4,213.4 816.1,212.8 820.8,212.0 825.5,211.1 830.2,210.1 834.9,208.9 839.6,207.6 844.3,206.2 849.0,204.7 853.7,203.1 858.4,201.3 863.1,199.5 867.8,197.5 872.5,195.5 877.2,193.3 881.9,191.1 886.6,188.7 891.3,186.3 896.0,183.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/><polyline points="802.0,214.0 806.7,213.7 811.4,213.2 816.1,212.3 820.8,211.3 825.5,210.0 830.2,208.6 834.9,207.0 839.6,205.2 844.3,203.2 849.0,201.1 853.7,198.8 858.4,196.4 863.1,193.8 867.8,191.1 872.5,188.2 877.2,185.3 881.9,182.1 886.6,178.9 891.3,175.5 896.0,172.0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/><path d="M 344.0 326 V 316 H 249 Q 241 316 241 308 V 89.0" fill="none" stroke="#1ABC9C" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="241" y1="241.0" x2="248" y2="241.0" stroke="#1ABC9C" stroke-width="1.6" marker-end="url(#qcm-head-teal)"/><line x1="241" y1="89.0" x2="248" y2="89.0" stroke="#1ABC9C" stroke-width="1.6" marker-end="url(#qcm-head-teal)"/><rect x="232" y="326" width="224" height="54" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="344.0" y="349" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Warming scenarios</text><text class="qcm-sans" x="344.0" y="367" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">six, from Paris-aligned to hot</text><text class="qcm-sans" x="478" y="348" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">Warming lowers growth, and weakens the primary balance when</text><text class="qcm-sans" x="478" y="365" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">spending is rigid. It never enters the equation directly.</text><line x1="460" y1="165" x2="486" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="477.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">feed</text><line x1="746" y1="165" x2="778" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="766.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">makes</text></svg>
