<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 664" role="img" aria-label="The course map, with the debt paths at the end of the chain highlighted." preserveAspectRatio="xMidYMid meet"><title>The course map, with the debt paths at the end of the chain highlighted.</title><defs><marker id="qcm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcm-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="16" y="14" width="372" height="78" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="202.0" y="47" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="middle">Country data + your assumptions</text><text class="qcm-sans" x="202.0" y="70" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">WEO and UN sources, and the controls you set</text><rect x="404" y="14" width="260" height="78" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="534.0" y="47" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="middle">Warming scenarios</text><text class="qcm-sans" x="534.0" y="70" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">six, from Paris-aligned to hot</text><rect x="16" y="132" width="648" height="156" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="158" font-size="14" font-weight="600" fill="#63757F" text-anchor="middle">The three numbers the equation needs</text><rect x="30" y="190" width="197" height="82" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="128.5" y="220" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="middle">Growth<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="8">g</tspan></text><text class="qcm-sans" x="128.5" y="241" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">demography, productivity,</text><text class="qcm-sans" x="128.5" y="258" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">inflation</text><rect x="241" y="190" width="197" height="82" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="339.5" y="220" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="middle">Interest rate<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="8">r</tspan></text><text class="qcm-sans" x="339.5" y="241" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">the rate rule applied</text><text class="qcm-sans" x="339.5" y="258" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">to the debt stock</text><rect x="452" y="190" width="197" height="82" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="550.5" y="220" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="middle">Primary balance<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="8">pb</tspan></text><text class="qcm-sans" x="550.5" y="241" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">revenue, spending,</text><text class="qcm-sans" x="550.5" y="258" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">the fiscal rule</text><rect x="140" y="366" width="400" height="106" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="396" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="middle">The debt equation</text><text class="qcm-serif" x="340.0" y="432" font-size="19" fill="#2C3E50" text-anchor="middle" font-style="italic">d<tspan font-size="11.8" dy="5.3">t</tspan><tspan dy="-5.3"> = d</tspan><tspan font-size="11.8" dy="5.3">t−1</tspan><tspan dy="-5.3" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="11.8" dy="5.3">t</tspan></text><text class="qcm-sans" x="340.0" y="456" font-size="12.5" font-weight="400" fill="#63757F" text-anchor="middle">last year's ratio, grown by r, shrunk by g</text><rect x="140" y="512" width="400" height="132" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="542" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt paths</text><text class="qcm-sans" x="340.0" y="562" font-size="12.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">baseline and the six warming scenarios</text><line x1="152" y1="633" x2="528" y2="633" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/><polyline points="158.0,628.0 176.2,628.0 194.4,627.8 212.6,627.7 230.8,627.5 249.0,627.2 267.2,627.0 285.4,626.7 303.6,626.3 321.8,625.9 340.0,625.5 358.2,625.1 376.4,624.6 394.6,624.2 412.8,623.6 431.0,623.1 449.2,622.5 467.4,621.9 485.6,621.3 503.8,620.7 522.0,620.0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="158.0,628.0 176.2,627.9 194.4,627.5 212.6,627.1 230.8,626.5 249.0,625.8 267.2,625.0 285.4,624.1 303.6,623.2 321.8,622.1 340.0,620.9 358.2,619.7 376.4,618.3 394.6,616.9 412.8,615.5 431.0,613.9 449.2,612.3 467.4,610.6 485.6,608.8 503.8,606.9 522.0,605.0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"/><polyline points="158.0,628.0 176.2,627.8 194.4,627.3 212.6,626.6 230.8,625.7 249.0,624.6 267.2,623.4 285.4,622.0 303.6,620.4 321.8,618.7 340.0,616.9 358.2,615.0 376.4,612.9 394.6,610.7 412.8,608.4 431.0,605.9 449.2,603.4 467.4,600.7 485.6,597.9 503.8,595.0 522.0,592.0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/><polyline points="158.0,628.0 176.2,627.7 194.4,627.0 212.6,626.0 230.8,624.8 249.0,623.3 267.2,621.5 285.4,619.6 303.6,617.5 321.8,615.1 340.0,612.6 358.2,609.9 376.4,607.0 394.6,604.0 412.8,600.7 431.0,597.3 449.2,593.8 467.4,590.1 485.6,586.2 503.8,582.2 522.0,578.0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.55" stroke-linecap="round"/><path d="M 534.0 92 V 120 H 128.5 V 186" fill="none" stroke="#1ABC9C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#qcm-head-teal)"/><path d="M 534.0 92 V 120 H 550.5 V 186" fill="none" stroke="#1ABC9C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#qcm-head-teal)"/><line x1="202.0" y1="92" x2="202.0" y2="124" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="216.0" y="105" font-size="12" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">manufactured into</text><line x1="340.0" y1="310" x2="340.0" y2="358" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="354.0" y="343.0" font-size="12" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">feed</text><line x1="340.0" y1="472" x2="340.0" y2="504" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="354.0" y="497.0" font-size="12" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">produces</text><text class="qcm-sans" x="340.0" y="306" font-size="12" font-weight="400" fill="#63757F" text-anchor="middle">Warming lowers growth, and weakens the primary balance when spending is rigid. It never enters the equation directly.</text></svg>
