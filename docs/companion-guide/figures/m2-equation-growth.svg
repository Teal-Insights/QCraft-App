<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" role="img" aria-label="Climate damage changes one symbol, and the symbol is g. The hot run is the same equation with a smaller growth rate, every year from 2030 onward." preserveAspectRatio="xMidYMid meet"><title>Climate damage changes one symbol, and the symbol is g</title><defs><marker id="qcx-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcx-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16A085"/></marker><marker id="qcx-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C0392B"/></marker></defs><style>.qcx-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcx-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><text class="qcx-sans" x="0.0" y="18.0" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="start">Climate damage changes one symbol, and the symbol is g</text><text class="qcx-sans" x="0.0" y="36.0" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="start">The hot run is the same equation with a smaller growth rate, every year from 2030 onward.</text><rect x="332.0" y="99.0" width="88.0" height="27.0" rx="4" ry="4" fill="#E3EEFB" stroke="none" stroke-width="1.3"/><text class="qcx-serif" x="193.0" y="100" font-size="30" fill="#AAB6BE" text-anchor="middle" font-style="italic">d<tspan font-size="18" dy="7">t</tspan></text><text class="qcx-serif" x="226.0" y="100.0" font-size="30" font-weight="400" fill="#AAB6BE" text-anchor="middle">=</text><text class="qcx-serif" x="270.0" y="100" font-size="30" fill="#AAB6BE" text-anchor="middle" font-style="italic">d<tspan font-size="18" dy="7">t&#8722;1</tspan></text><text class="qcx-serif" x="314.0" y="100.0" font-size="30" font-weight="400" fill="#AAB6BE" text-anchor="middle">×</text><text class="qcx-serif" x="376.0" y="88.0" font-size="22" font-weight="400" fill="#AAB6BE" text-anchor="middle" font-style="italic">1 + r</text><line x1="340.0" y1="95" x2="412.0" y2="95" stroke="#AAB6BE" stroke-width="1.6"/><text class="qcx-serif" x="376.0" y="118.0" font-size="22" font-weight="400" fill="#2a78d6" text-anchor="middle" font-style="italic">1 + g</text><text class="qcx-serif" x="438.0" y="100.0" font-size="30" font-weight="400" fill="#AAB6BE" text-anchor="middle">−</text><text class="qcx-serif" x="479.0" y="100" font-size="30" fill="#AAB6BE" text-anchor="middle" font-style="italic">pb<tspan font-size="18" dy="7">t</tspan></text><line x1="376.0" y1="128" x2="376.0" y2="144" stroke="#2a78d6" stroke-width="1.6"/><rect x="200.0" y="144.0" width="280.0" height="28.0" rx="6" ry="6" fill="#E3EEFB" stroke="none" stroke-width="1.3"/><text class="qcx-sans" x="340.0" y="163.0" font-size="13" font-weight="600" fill="#2a78d6" text-anchor="middle">same equation, new g</text><text class="qcx-sans" x="268.0" y="193.0" font-size="9" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">BASELINE</text><text class="qcx-sans" x="372.0" y="193.0" font-size="9" font-weight="600" fill="#C0392B" text-anchor="start" letter-spacing="1.4">HOT</text><text class="qcx-sans" x="0.0" y="206.0" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">g, nominal GDP growth in 2099</text><text class="qcx-sans" x="268.0" y="206.0" font-size="14" font-weight="600" fill="#2a78d6" text-anchor="start">4.62%</text><text class="qcx-sans" x="372.0" y="206.0" font-size="14" font-weight="600" fill="#C0392B" text-anchor="start">4.56%</text><text class="qcx-sans" x="0.0" y="230.0" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">debt ratio in 2099</text><text class="qcx-sans" x="268.0" y="230.0" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="start">51%</text><text class="qcx-sans" x="372.0" y="230.0" font-size="14" font-weight="600" fill="#C0392B" text-anchor="start">99%</text><text class="qcx-sans" x="456.0" y="193.0" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="start">0.06 of a percentage point off</text><text class="qcx-sans" x="456.0" y="208.0" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="start">growth in the final year, and a</text><text class="qcx-sans" x="456.0" y="223.0" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="start">shortfall that has been</text><text class="qcx-sans" x="456.0" y="238.0" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="start">compounding since 2030.</text><text class="qcx-sans" x="0.0" y="255.0" font-size="9.5" font-weight="400" fill="#63757F" text-anchor="start">Source: this repository's engine, Kenya at the shipped defaults, from</text><text class="qcx-sans" x="0.0" y="268.0" font-size="9.5" font-weight="400" fill="#63757F" text-anchor="start">figures/series/m2-climate-trace.csv.</text></svg>
