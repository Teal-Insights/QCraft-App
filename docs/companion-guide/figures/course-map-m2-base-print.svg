<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 748" role="img" aria-label="The course map with every node in the base chain highlighted and the warming scenarios block absent." preserveAspectRatio="xMidYMid meet"><title>The course map with every node in the base chain highlighted and the warming scenarios block absent.</title><defs><marker id="qcm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcm-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker><marker id="qcm-head-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#EAEEF1"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="8" y="12" width="214" height="104" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="115.0" y="36" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Macro series</text><text class="qcm-sans" x="115.0" y="54" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">IMF World Economic Outlook</text><text class="qcm-sans" x="115.0" y="75" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">real GDP, nominal GDP, deflator,</text><text class="qcm-sans" x="115.0" y="89" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">revenue, expenditure, debt,</text><text class="qcm-sans" x="115.0" y="103" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">primary and overall balance</text><rect x="233" y="12" width="214" height="104" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="36" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Population</text><text class="qcm-sans" x="340.0" y="54" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">UN World Population Prospects</text><text class="qcm-sans" x="340.0" y="75" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">by age group, working age 15-64,</text><text class="qcm-sans" x="340.0" y="89" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">medium, high and low variants</text><rect x="458" y="12" width="214" height="104" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="565.0" y="36" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">The controls you set</text><text class="qcm-sans" x="565.0" y="54" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">five, in the sidebar</text><text class="qcm-sans" x="565.0" y="75" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">country, demography variant,</text><text class="qcm-sans" x="565.0" y="89" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">debt target, fiscal rule,</text><text class="qcm-sans" x="565.0" y="103" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">expenditure rigidity</text><path d="M 115.0 116 V 130 H 565.0 V 116" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><path d="M 340.0 116 V 130" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><line x1="340.0" y1="130" x2="340.0" y2="230" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="326.0" y="166" font-size="12" font-weight="500" fill="#63757F" text-anchor="end" font-style="italic">manufactured into</text><rect x="12" y="238" width="656" height="150" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="264" font-size="13.5" font-weight="600" fill="#63757F" text-anchor="middle">The three numbers the equation needs</text><rect x="26" y="294" width="198" height="78" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="125.0" y="322" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Growth<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">g</tspan></text><text class="qcm-sans" x="125.0" y="342" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">demography, productivity,</text><text class="qcm-sans" x="125.0" y="358" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">inflation</text><rect x="241" y="294" width="198" height="78" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="322" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Interest rate<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">r</tspan></text><text class="qcm-sans" x="340.0" y="342" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">the rate rule applied</text><text class="qcm-sans" x="340.0" y="358" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">to the debt stock</text><rect x="456" y="294" width="198" height="78" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="555.0" y="322" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Primary balance<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">pb</tspan></text><text class="qcm-sans" x="555.0" y="342" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">revenue, spending,</text><text class="qcm-sans" x="555.0" y="358" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">the fiscal rule</text><rect x="148" y="458" width="384" height="104" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="486" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">The debt dynamics equation</text><text class="qcm-serif" x="340.0" y="522" font-size="18" fill="#FFFFFF" text-anchor="middle" font-style="italic">d<tspan font-size="11.2" dy="5.0">t</tspan><tspan dy="-5.0"> = d</tspan><tspan font-size="11.2" dy="5.0">t−1</tspan><tspan dy="-5.0" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="11.2" dy="5.0">t</tspan></text><text class="qcm-sans" x="340.0" y="546" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">last year's ratio, grown by r, shrunk by g</text><rect x="148" y="608" width="384" height="126" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="636" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">The baseline</text><text class="qcm-sans" x="340.0" y="655" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">one path, and no scenario to compare it with</text><line x1="159" y1="723" x2="521" y2="723" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/><polyline points="164.0,718.0 181.6,718.0 199.2,717.8 216.8,717.7 234.4,717.5 252.0,717.3 269.6,717.0 287.2,716.7 304.8,716.4 322.4,716.0 340.0,715.6 357.6,715.2 375.2,714.8 392.8,714.3 410.4,713.8 428.0,713.3 445.6,712.7 463.2,712.2 480.8,711.6 498.4,711.0 516.0,710.3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><line x1="340.0" y1="410" x2="340.0" y2="450" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="354.0" y="439.0" font-size="12" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">feed</text><line x1="340.0" y1="562" x2="340.0" y2="600" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="354.0" y="590.0" font-size="12" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">produces</text></svg>
