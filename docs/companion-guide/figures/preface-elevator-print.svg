<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-label="The elevator chain: a warming world slows growth and squeezes the primary balance, both feed the debt dynamics equation, and the equation produces debt paths to 2099." preserveAspectRatio="xMidYMid meet"><title>The elevator chain: a warming world slows growth and squeezes the primary balance, both feed the debt dynamics equation, and the equation produces debt paths to 2099.</title><defs><marker id="qcp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcp-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="244" y="16" width="192" height="88" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="40" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">A warming world</text><text class="qcm-sans" x="340.0" y="59" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">six scenarios,</text><text class="qcm-sans" x="340.0" y="73" font-size="10.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">Paris to Hot unadapted</text><path d="M 340.0 104 V 132 H 190.0 V 172" fill="none" stroke="#1ABC9C" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#qcp-head-teal)"/><path d="M 340.0 132 H 490.0 V 172" fill="none" stroke="#1ABC9C" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#qcp-head-teal)"/><rect x="56" y="176" width="268" height="84" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="190.0" y="200" font-size="13.5" font-weight="600" fill="#2C3E50" text-anchor="middle">Growth slows<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">g</tspan></text><text class="qcm-sans" x="190.0" y="219" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">hotter years drag on</text><text class="qcm-sans" x="190.0" y="233" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">productivity</text><rect x="356" y="176" width="268" height="84" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="490.0" y="200" font-size="13.5" font-weight="600" fill="#2C3E50" text-anchor="middle">The primary balance weakens<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">pb</tspan></text><text class="qcm-sans" x="490.0" y="219" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">spending stays rigid while</text><text class="qcm-sans" x="490.0" y="233" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">the tax base slows</text><path d="M 190.0 260 V 288 H 490.0 V 260" fill="none" stroke="#CBD5DB" stroke-width="1.8"/><line x1="340.0" y1="288" x2="340.0" y2="324" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcp-head)"/><text class="qcm-sans" x="354.0" y="314.0" font-size="11" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">feed</text><rect x="190" y="332" width="300" height="122" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="358" font-size="14.5" font-weight="600" fill="#2C3E50" text-anchor="middle">The debt dynamics equation</text><text class="qcm-serif" x="340.0" y="392" font-size="15.5" fill="#2C3E50" text-anchor="middle" font-style="italic">d<tspan font-size="9.6" dy="4.3">t</tspan><tspan dy="-4.3"> = d</tspan><tspan font-size="9.6" dy="4.3">t−1</tspan><tspan dy="-4.3" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="9.6" dy="4.3">t</tspan></text><text class="qcm-sans" x="340.0" y="418" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">the interest rate joins here,</text><text class="qcm-sans" x="340.0" y="432" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">untouched by warming</text><line x1="340.0" y1="454" x2="340.0" y2="488" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcp-head)"/><text class="qcm-sans" x="354.0" y="479.0" font-size="11" font-weight="500" fill="#63757F" text-anchor="start" font-style="italic">makes</text><rect x="240" y="496" width="200" height="132" rx="8" ry="8" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="522" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt paths</text><text class="qcm-sans" x="340.0" y="542" font-size="11" font-weight="400" fill="#DFF6F0" text-anchor="middle">a baseline and six</text><text class="qcm-sans" x="340.0" y="556" font-size="11" font-weight="400" fill="#DFF6F0" text-anchor="middle">warming paths to 2099</text><line x1="251" y1="615" x2="429" y2="615" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/><polyline points="256.0,610.0 264.4,610.0 272.8,609.8 281.2,609.7 289.6,609.5 298.0,609.3 306.4,609.0 314.8,608.7 323.2,608.4 331.6,608.0 340.0,607.6 348.4,607.2 356.8,606.8 365.2,606.3 373.6,605.8 382.0,605.3 390.4,604.7 398.8,604.2 407.2,603.6 415.6,603.0 424.0,602.3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="256.0,610.0 264.4,609.9 272.8,609.6 281.2,609.1 289.6,608.6 298.0,607.9 306.4,607.1 314.8,606.3 323.2,605.3 331.6,604.3 340.0,603.2 348.4,602.0 356.8,600.7 365.2,599.4 373.6,598.0 382.0,596.5 390.4,594.9 398.8,593.3 407.2,591.5 415.6,589.8 424.0,587.9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round"/><polyline points="256.0,610.0 264.4,609.8 272.8,609.3 281.2,608.6 289.6,607.8 298.0,606.7 306.4,605.5 314.8,604.2 323.2,602.7 331.6,601.1 340.0,599.4 348.4,597.5 356.8,595.5 365.2,593.4 373.6,591.2 382.0,588.8 390.4,586.4 398.8,583.8 407.2,581.1 415.6,578.3 424.0,575.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/><polyline points="256.0,610.0 264.4,609.7 272.8,609.0 281.2,608.1 289.6,606.9 298.0,605.5 306.4,603.8 314.8,601.9 323.2,599.9 331.6,597.6 340.0,595.2 348.4,592.6 356.8,589.9 365.2,586.9 373.6,583.8 382.0,580.6 390.4,577.2 398.8,573.6 407.2,569.9 415.6,566.0 424.0,562.0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/><text class="qcm-sans" x="340.0" y="668" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">Warming never enters the equation directly.</text><text class="qcm-sans" x="340.0" y="684" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">It reaches the debt line only through growth and the primary balance.</text></svg>
