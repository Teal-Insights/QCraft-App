<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 706" role="img" aria-label="The course map, with the debt paths highlighted." preserveAspectRatio="xMidYMid meet"><title>The course map, with the debt paths highlighted.</title><defs><marker id="qcm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcm-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="12" y="12" width="204" height="62" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="114.0" y="38" font-size="14.5" font-weight="600" fill="#2C3E50" text-anchor="middle">Macro series</text><text class="qcm-sans" x="114.0" y="57" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">IMF World Economic Outlook</text><rect x="238" y="12" width="204" height="62" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="38" font-size="14.5" font-weight="600" fill="#2C3E50" text-anchor="middle">Population</text><text class="qcm-sans" x="340.0" y="57" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">UN World Population Prospects</text><rect x="464" y="12" width="204" height="62" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="566.0" y="38" font-size="14.5" font-weight="600" fill="#2C3E50" text-anchor="middle">The controls you set</text><text class="qcm-sans" x="566.0" y="57" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">five of them, in the sidebar</text><path d="M 114.0 74 V 88 H 566.0 V 74" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><path d="M 340.0 74 V 88" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><line x1="340.0" y1="88" x2="340.0" y2="188" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="326.0" y="124" font-size="12" font-weight="500" fill="#63757F" text-anchor="end" font-style="italic">manufactured into</text><rect x="400" y="106" width="268" height="56" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="534.0" y="130" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="middle">Warming scenarios</text><text class="qcm-sans" x="534.0" y="149" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">six, from Paris-aligned to hot</text><rect x="12" y="196" width="656" height="150" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="222" font-size="13.5" font-weight="600" fill="#63757F" text-anchor="middle">The three numbers the equation needs</text><rect x="26" y="252" width="198" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="125.0" y="280" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="middle">Growth<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">g</tspan></text><text class="qcm-sans" x="125.0" y="300" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">demography, productivity,</text><text class="qcm-sans" x="125.0" y="316" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">inflation</text><rect x="241" y="252" width="198" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="280" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="middle">Interest rate<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">r</tspan></text><text class="qcm-sans" x="340.0" y="300" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">the rate rule applied</text><text class="qcm-sans" x="340.0" y="316" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">to the debt stock</text><rect x="456" y="252" width="198" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="555.0" y="280" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="middle">Primary balance<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="7">pb</tspan></text><text class="qcm-sans" x="555.0" y="300" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">revenue, spending,</text><text class="qcm-sans" x="555.0" y="316" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">the fiscal rule</text><rect x="148" y="416" width="384" height="104" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="444" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="middle">The debt dynamics equation</text><text class="qcm-serif" x="340.0" y="480" font-size="18" fill="#2C3E50" text-anchor="middle" font-style="italic">d<tspan font-size="11.2" dy="5.0">t</tspan><tspan dy="-5.0"> = d</tspan><tspan font-size="11.2" dy="5.0">t−1</tspan><tspan dy="-5.0" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="11.2" dy="5.0">t</tspan></text><text class="qcm-sans" x="340.0" y="504" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="middle">last year's ratio, grown by r, shrunk by g</text><rect x="148" y="566" width="384" height="126" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="594" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Debt paths</text><text class="qcm-sans" x="340.0" y="613" font-size="11.5" font-weight="400" fill="#DFF6F0" text-anchor="middle">baseline and the 