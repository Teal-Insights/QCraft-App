<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 542" role="img" aria-label="The four questions the tool answers, beside a small chart of two runs of the same model with the gap between them marked as the answer." preserveAspectRatio="xMidYMid meet"><title>The four questions the tool answers, beside a small chart of two runs of the same model with the gap between them marked as the answer.</title><defs><marker id="qcp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcp-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="90" y="14" width="500" height="250" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="340.0" y="42" font-size="14" font-weight="600" fill="#63757F" text-anchor="middle">Two runs of the same model</text><line x1="138" y1="212" x2="542" y2="212" stroke="#E1E7EB" stroke-width="1.4"/><polyline points="138.0,206.0 154.2,205.9 170.5,205.6 186.8,205.2 203.0,204.6 219.2,203.8 235.5,202.9 251.8,201.9 268.0,200.7 284.2,199.4 300.5,197.9 316.8,196.3 333.0,194.6 349.2,192.7 365.5,190.7 381.8,188.6 398.0,186.3 414.2,183.9 430.5,181.3 446.8,178.7 463.0,175.9 479.2,172.9 495.5,169.9 511.8,166.7 528.0,163.4" fill="none" stroke="#2C3E50" stroke-width="2.4" stroke-linecap="round"/><polyline points="138.0,206.0 154.2,205.7 170.5,204.8 186.8,203.4 203.0,201.6 219.2,199.2 235.5,196.4 251.8,193.2 268.0,189.4 284.2,185.3 300.5,180.7 316.8,175.7 333.0,170.2 349.2,164.4 365.5,158.1 381.8,151.4 398.0,144.2 414.2,136.7 430.5,128.7 446.8,120.4 463.0,111.6 479.2,102.4 495.5,92.9 511.8,82.9 528.0,72.5" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round"/><line x1="536" y1="72.52000000000001" x2="536" y2="163.4" stroke="#16A085" stroke-width="2" stroke-dasharray="3 3"/><line x1="532" y1="72.52000000000001" x2="540" y2="72.52000000000001" stroke="#16A085" stroke-width="2"/><line x1="532" y1="163.4" x2="540" y2="163.4" stroke="#16A085" stroke-width="2"/><text class="qcm-sans" x="526" y="121.96000000000001" font-size="11" font-weight="600" fill="#16A085" text-anchor="end" font-style="italic">the answer</text><text class="qcm-sans" x="372.0" y="203" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="middle">baseline</text><text class="qcm-sans" x="340.8" y="117.96" font-size="10.5" font-weight="400" fill="#C0392B" text-anchor="middle">warming scenario</text><text class="qcm-sans" x="138" y="228" font-size="10" font-weight="400" fill="#63757F" text-anchor="start">today</text><text class="qcm-sans" x="542" y="228" font-size="10" font-weight="400" fill="#63757F" text-anchor="end">2099</text><text class="qcm-sans" x="340.0" y="252" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">same country, same controls, one scenario switched on</text><rect x="18" y="288" width="314" height="108" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><circle cx="42" cy="314" r="11" fill="#1ABC9C"/><text class="qcm-sans" x="42" y="318" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text class="qcm-sans" x="62" y="312" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">Where is our debt ratio in 2050,</text><text class="qcm-sans" x="62" y="329" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">and in 2099?</text><text class="qcm-sans" x="62" y="348" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="start">read the path at the year you care about</text><rect x="348" y="288" width="314" height="108" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><circle cx="372" cy="314" r="11" fill="#1ABC9C"/><text class="qcm-sans" x="372" y="318" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text class="qcm-sans" x="392" y="312" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">How much of the path is climate</text><text class="qcm-sans" x="392" y="329" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">damage?</text><text class="qcm-sans" x="392" y="348" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="start">the gap between scenario and baseline</text><rect x="18" y="412" width="314" height="108" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><circle cx="42" cy="438" r="11" fill="#1ABC9C"/><text class="qcm-sans" x="42" y="442" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text class="qcm-sans" x="62" y="436" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">When does damage breach the</text><text class="qcm-sans" x="62" y="453" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">fiscal rule?</text><text class="qcm-sans" x="62" y="472" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="start">the year the gap carries you over your ceiling</text><rect x="348" y="412" width="314" height="108" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><circle cx="372" cy="438" r="11" fill="#1ABC9C"/><text class="qcm-sans" x="372" y="442" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text class="qcm-sans" x="392" y="436" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">Which assumption moves the</text><text class="qcm-sans" x="392" y="453" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="start">answer most?</text><text class="qcm-sans" x="392" y="472" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="start">change one control, run again, compare</text></svg>
