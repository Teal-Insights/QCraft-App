<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-label="Six moves, and the last one is already capstone material. Run the tool before you read how it works. The two CSVs from step 6 are the first page of your export packet." preserveAspectRatio="xMidYMid meet"><title>Six moves, and the last one is already capstone material</title><defs><marker id="qcx-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcx-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#16A085"/></marker><marker id="qcx-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C0392B"/></marker></defs><style>.qcx-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcx-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><text class="qcx-sans" x="0.0" y="18.0" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="start">Six moves, and the last one is already capstone material</text><text class="qcx-sans" x="0.0" y="36.0" font-size="11.5" font-weight="400" fill="#63757F" text-anchor="start">Run the tool before you read how it works. The two CSVs from step 6 are the first page of your export packet.</text><rect x="0.0" y="62.0" width="176.0" height="132.0" rx="6" ry="6" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.3"/><text class="qcx-sans" x="12.0" y="82.0" font-size="9.5" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">SIDEBAR</text><circle cx="23.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="23.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="53.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="53.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text class="qcx-sans" x="12.0" y="138.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Pick a country. WEO and</text><text class="qcx-sans" x="12.0" y="151.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">UN series load themselves.</text><text class="qcx-sans" x="12.0" y="164.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Check the debt ratio and</text><text class="qcx-sans" x="12.0" y="177.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">population it reports.</text><rect x="184.0" y="62.0" width="118.0" height="132.0" rx="6" ry="6" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.3"/><text class="qcx-sans" x="196.0" y="82.0" font-size="9.5" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">BASELINE TAB</text><circle cx="207.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="207.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><text class="qcx-sans" x="196.0" y="138.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">The path with no</text><text class="qcx-sans" x="196.0" y="151.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">climate damage.</text><text class="qcx-sans" x="196.0" y="164.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Note the 2099</text><text class="qcx-sans" x="196.0" y="177.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">debt ratio.</text><rect x="310.0" y="62.0" width="118.0" height="132.0" rx="6" ry="6" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.3"/><text class="qcx-sans" x="322.0" y="82.0" font-size="9.5" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">CLIMATE TAB</text><circle cx="333.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="333.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text class="qcx-sans" x="322.0" y="138.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Six warming</text><text class="qcx-sans" x="322.0" y="151.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">scenarios, and</text><text class="qcx-sans" x="322.0" y="164.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">what each does</text><text class="qcx-sans" x="322.0" y="177.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">to GDP.</text><rect x="436.0" y="62.0" width="118.0" height="132.0" rx="6" ry="6" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.3"/><text class="qcx-sans" x="448.0" y="82.0" font-size="9.5" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">ANALYSIS TAB</text><circle cx="459.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="459.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><text class="qcx-sans" x="448.0" y="138.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Both on one chart.</text><text class="qcx-sans" x="448.0" y="151.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">The vertical gap is</text><text class="qcx-sans" x="448.0" y="164.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">what your paragraph</text><text class="qcx-sans" x="448.0" y="177.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">will be about.</text><rect x="562.0" y="62.0" width="118.0" height="132.0" rx="6" ry="6" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.3"/><text class="qcx-sans" x="574.0" y="82.0" font-size="9.5" font-weight="600" fill="#63757F" text-anchor="start" letter-spacing="1.4">DATA TAB</text><circle cx="585.0" cy="108.0" r="11" fill="#1ABC9C"/><text class="qcx-sans" x="585.0" y="112.2" font-size="11.55" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text><text class="qcx-sans" x="574.0" y="138.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">Download both</text><text class="qcx-sans" x="574.0" y="151.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">CSVs. Keep them.</text><text class="qcx-sans" x="574.0" y="164.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">This is capstone</text><text class="qcx-sans" x="574.0" y="177.0" font-size="9.5" font-weight="400" fill="#2C3E50" text-anchor="start">material.</text><line x1="177.0" y1="108.0" x2="183.0" y2="108.0" stroke="#CBD5DB" stroke-width="1.5" marker-end="url(#qcx-head)"/><line x1="303.0" y1="108.0" x2="309.0" y2="108.0" stroke="#CBD5DB" stroke-width="1.5" marker-end="url(#qcx-head)"/><line x1="429.0" y1="108.0" x2="435.0" y2="108.0" stroke="#CBD5DB" stroke-width="1.5" marker-end="url(#qcx-head)"/><line x1="555.0" y1="108.0" x2="561.0" y2="108.0" stroke="#CBD5DB" stroke-width="1.5" marker-end="url(#qcx-head)"/><rect x="0.0" y="208.0" width="680.0" height="26.0" rx="4" ry="4" fill="#E7F6F2" stroke="none" stroke-width="1.3"/><text class="qcx-sans" x="12.0" y="225.0" font-size="10.5" font-weight="400" fill="#2C3E50" text-anchor="start">About ten minutes, five clicks, and nothing explained yet. The explanation lands better on something you have already seen move.</text><text class="qcx-sans" x="0.0" y="262.0" font-size="9.5" font-weight="400" fill="#63757F" text-anchor="start">Q-CRAFT Explorer, sidebar and four tabs. The parameters you leave alone in this run are the subject of Module 3.</text></svg>
