<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 392" role="img" aria-label="The course map, with the debt dynamics equation highlighted." preserveAspectRatio="xMidYMid meet"><title>The course map, with the debt dynamics equation highlighted.</title><defs><marker id="qcm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#CBD5DB"/></marker><marker id="qcm-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ABC9C"/></marker><marker id="qcm-head-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#EAEEF1"/></marker></defs><style>.qcm-sans{font-family:"Söhne","Inter",system-ui,-apple-system,sans-serif;}.qcm-serif{font-family:"Tiempos Headline","IBM Plex Serif",Georgia,serif;}</style><rect x="8" y="16" width="200" height="84" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="108.0" y="36" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Macro series</text><text class="qcm-sans" x="108.0" y="51" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">IMF World Economic Outlook</text><text class="qcm-sans" x="108.0" y="68" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">real GDP, nominal GDP, deflator,</text><text class="qcm-sans" x="108.0" y="81" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">revenue, expenditure, debt,</text><text class="qcm-sans" x="108.0" y="94" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">primary and overall balance</text><path d="M 208 58.0 H 222" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><rect x="8" y="116" width="200" height="84" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="108.0" y="136" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Population</text><text class="qcm-sans" x="108.0" y="151" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">UN World Population Prospects</text><text class="qcm-sans" x="108.0" y="168" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">by age group, working age 15-64,</text><text class="qcm-sans" x="108.0" y="181" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">medium, high and low variants</text><path d="M 208 158.0 H 222" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><rect x="8" y="216" width="200" height="84" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="108.0" y="236" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">The controls you set</text><text class="qcm-sans" x="108.0" y="251" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">five, in the sidebar</text><text class="qcm-sans" x="108.0" y="268" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">country, demography variant,</text><text class="qcm-sans" x="108.0" y="281" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">debt target, fiscal rule,</text><text class="qcm-sans" x="108.0" y="294" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">expenditure rigidity</text><path d="M 208 258.0 H 222" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><path d="M 222 58.0 V 258.0" fill="none" stroke="#CBD5DB" stroke-width="1.6"/><line x1="222" y1="165" x2="246" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="238.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">build</text><rect x="254" y="14" width="222" height="292" rx="14" ry="14" fill="#F5F7F9" stroke="#E1E7EB" stroke-width="1.6"/><text class="qcm-sans" x="365.0" y="34" font-size="12.5" font-weight="600" fill="#63757F" text-anchor="middle">The three numbers</text><text class="qcm-sans" x="365.0" y="50" font-size="12.5" font-weight="600" fill="#63757F" text-anchor="middle">the equation needs</text><rect x="272" y="60" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="365.0" y="83" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Growth<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">g</tspan></text><text class="qcm-sans" x="365.0" y="99" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">demography, productivity,</text><text class="qcm-sans" x="365.0" y="112" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">inflation</text><rect x="272" y="136" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="365.0" y="159" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Interest rate<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">r</tspan></text><text class="qcm-sans" x="365.0" y="175" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">the rate rule applied</text><text class="qcm-sans" x="365.0" y="188" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">to the debt stock</text><rect x="272" y="212" width="186" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="365.0" y="235" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Primary balance<tspan class="qcm-serif" font-style="italic" font-weight="400" dx="6">pb</tspan></text><text class="qcm-sans" x="365.0" y="251" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">revenue, spending,</text><text class="qcm-sans" x="365.0" y="264" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">the fiscal rule</text><rect x="516" y="104" width="246" height="122" rx="10" ry="10" fill="#1ABC9C" stroke="#16A085" stroke-width="1.6"/><text class="qcm-sans" x="639.0" y="130" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">The debt dynamics equation</text><text class="qcm-serif" x="639.0" y="170" font-size="14.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">d<tspan font-size="9.0" dy="4.1">t</tspan><tspan dy="-4.1"> = d</tspan><tspan font-size="9.0" dy="4.1">t−1</tspan><tspan dy="-4.1" font-style="normal"> × </tspan><tspan>(1+r) / (1+g)</tspan><tspan font-style="normal"> − </tspan><tspan>pb</tspan><tspan font-size="9.0" dy="4.1">t</tspan></text><text class="qcm-sans" x="639.0" y="196" font-size="11" font-weight="400" fill="#DFF6F0" text-anchor="middle">last year's ratio, grown by r,</text><text class="qcm-sans" x="639.0" y="209" font-size="11" font-weight="400" fill="#DFF6F0" text-anchor="middle">shrunk by g</text><rect x="808" y="102" width="126" height="126" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="871.0" y="128" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Debt paths</text><text class="qcm-sans" x="871.0" y="145" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">baseline and six</text><text class="qcm-sans" x="871.0" y="158" font-size="10.5" font-weight="400" fill="#63757F" text-anchor="middle">warming scenarios</text><line x1="819" y1="219" x2="923" y2="219" stroke="#E1E7EB" stroke-width="1.2" stroke-opacity="1"/><polyline points="824.0,214.0 828.7,214.0 833.4,213.9 838.1,213.7 842.8,213.6 847.5,213.4 852.2,213.1 856.9,212.9 861.6,212.6 866.3,212.3 871.0,211.9 875.7,211.6 880.4,211.2 885.1,210.8 889.8,210.3 894.5,209.9 899.2,209.4 903.9,208.9 908.6,208.4 913.3,207.8 918.0,207.3" fill="none" stroke="#2C3E50" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="824.0,214.0 828.7,213.9 833.4,213.6 838.1,213.2 842.8,212.7 847.5,212.2 852.2,211.5 856.9,210.8 861.6,209.9 866.3,209.0 871.0,208.1 875.7,207.0 880.4,205.9 885.1,204.7 889.8,203.5 894.5,202.2 899.2,200.8 903.9,199.3 908.6,197.8 913.3,196.3 918.0,194.7" fill="none" stroke="#27AE60" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="824.0,214.0 828.7,213.8 833.4,213.4 838.1,212.8 842.8,212.0 847.5,211.1 852.2,210.1 856.9,208.9 861.6,207.6 866.3,206.2 871.0,204.7 875.7,203.1 880.4,201.3 885.1,199.5 889.8,197.5 894.5,195.5 899.2,193.3 903.9,191.1 908.6,188.7 913.3,186.3 918.0,183.8" fill="none" stroke="#E67E22" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><polyline points="824.0,214.0 828.7,213.7 833.4,213.2 838.1,212.3 842.8,211.3 847.5,210.0 852.2,208.6 856.9,207.0 861.6,205.2 866.3,203.2 871.0,201.1 875.7,198.8 880.4,196.4 885.1,193.8 889.8,191.1 894.5,188.2 899.2,185.3 903.9,182.1 908.6,178.9 913.3,175.5 918.0,172.0" fill="none" stroke="#E74C3C" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/><path d="M 366.0 326 V 316 H 271 Q 263 316 263 308 V 89.0" fill="none" stroke="#1ABC9C" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="263" y1="241.0" x2="270" y2="241.0" stroke="#1ABC9C" stroke-width="1.6" marker-end="url(#qcm-head-teal)"/><line x1="263" y1="89.0" x2="270" y2="89.0" stroke="#1ABC9C" stroke-width="1.6" marker-end="url(#qcm-head-teal)"/><rect x="254" y="326" width="224" height="54" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5DB" stroke-width="1.6"/><text class="qcm-sans" x="366.0" y="349" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle">Warming scenarios</text><text class="qcm-sans" x="366.0" y="367" font-size="11" font-weight="400" fill="#63757F" text-anchor="middle">six, from Paris-aligned to hot</text><text class="qcm-sans" x="500" y="348" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">Warming lowers growth, and weakens the primary balance when</text><text class="qcm-sans" x="500" y="365" font-size="11" font-weight="400" fill="#63757F" text-anchor="start">spending is rigid. It never enters the equation directly.</text><line x1="482" y1="165" x2="508" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="499.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">feed</text><line x1="768" y1="165" x2="800" y2="165" stroke="#CBD5DB" stroke-width="1.8" marker-end="url(#qcm-head)"/><text class="qcm-sans" x="788.0" y="154" font-size="11" font-weight="500" fill="#63757F" text-anchor="middle" font-style="italic">makes</text></svg>
