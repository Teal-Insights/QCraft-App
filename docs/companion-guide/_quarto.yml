project:
  type: book
  output-dir: _book
  resources:
    # Self-hosted open faces. Bundled so the book renders offline and inside
    # networks that block font CDNs. See fonts/open/README.md.
    - fonts/
  post-render:
    # The index Quarto writes carries the inlined SVG figures' text nodes and
    # holds the glossary as one undifferentiated page. Both were search findings
    # in the 31 August ergonomics review. See the script's own header.
    - python3 ../../scripts/clean_search_index.py --book _book
    # Publication gate: fails the render if authoring-only content reached the
    # HTML, the PDF or the index, or if a marker in the source escaped the
    # authoring-note class. Skips its render half under the authoring profile.
    - python3 ../../scripts/check_publication_safety.py --guide . --book _book

book:
  title: "Q-CRAFT Explorer Companion Guide"
  subtitle: "A course in climate-aware fiscal projection"
  author: "Teal Insights & NatureFinance"
  date: last-modified
  chapters:
    - index.qmd
    - m0-start-here.qmd
    - m1-how-qcraft-thinks.qmd
    - m2-debt-equation.qmd
    - m3-parameters.qmd
    - m4-worked-example.qmd
    - m5-boundaries.qmd
    - m6-capstone.qmd
  appendices:
    - appendix-workbook.qmd
    - appendix-codesign.qmd
    - glossary.qmd
    - references.qmd
  downloads: [pdf]

# The sidebar reads Module 0 to Module 6, matching every reference in the prose.
# Automatic chapter numbers are suppressed for that reason: with them on, Quarto
# numbered the preface as chapter 1, so Module 4 rendered as sidebar item 5 and
# every @sec- cross reference to it read "Chapter 5".
language:
  search-text-placeholder: "Search guide"
  search-label: "Search guide"
  search-submit-button-title: "Search guide"

filters:
  # Runs before Quarto's own filters so it can see a callout as a Div.
  - at: pre-quarto
    path: _authoring-notes.lua

format:
  html:
    theme:
      light:
        - flatly
        - _theme.scss
    css:
      - _custom.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
  pdf:
    documentclass: report
    geometry:
      - margin=1in
    fontsize: 11pt
    colorlinks: true
    toc: true
    number-sections: false
