project:
  type: book
  output-dir: _book
  resources:
    # Self-hosted open faces. Bundled so the book renders offline and inside
    # networks that block font CDNs. See fonts/open/README.md.
    - fonts/

book:
  title: "Q-CRAFT Explorer Companion Guide"
  subtitle: "A course in climate-aware fiscal projection"
  author: "Teal Insights & NatureFinance"
  date: "2026-03-17"
  chapters:
    - index.qmd
    - m0-start-here.qmd
    - m1-how-qcraft-thinks.qmd
    - m2-debt-equation.qmd
    - m3-parameters.qmd
    - m4-uganda-end-to-end.qmd
    - m5-boundaries.qmd
    - m6-capstone.qmd
  appendices:
    - appendix-codesign.qmd
    - glossary.qmd
    - references.qmd
  downloads: [pdf]

format:
  html:
    theme:
      light:
        - flatly
        - _theme.scss
    css:
      - _custom.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
  pdf:
    documentclass: report
    geometry:
      - margin=1in
    fontsize: 11pt
    colorlinks: true
    toc: true
    number-sections: true
